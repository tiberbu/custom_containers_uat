name: Build Secure CRM UAT Image

on:
  workflow_dispatch:
    inputs:
      image:
        required: true
        type: string
      version:
        required: true
        type: string
      frappe-repo:
        required: true
        type: string
      frappe-version:
        required: true
        type: string
      py-version:
        required: true
        type: string
      nodejs-version:
        required: true
        type: string
      apps-json-base64:
        required: true
        type: string
      dockerfile:
        required: true
        type: string

env:
  AWS_REGION: eu-west-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-2.amazonaws.com

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: ""
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: -arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Validate UAT build inputs and prepare app list
        env:
          IMAGE_NAME: ${{ inputs.image }}
          IMAGE_VERSION: ${{ inputs.version }}
          FRAPPE_REPO: ${{ inputs.frappe-repo }}
          FRAPPE_VERSION: ${{ inputs.frappe-version }}
          PY_VERSION: ${{ inputs.py-version }}
          NODEJS_VERSION: ${{ inputs.nodejs-version }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          APPS_JSON_BASE64: ${{ inputs.apps-json-base64 }}
        run: |
          [[ "$IMAGE_NAME" == "crm-uat" ]]
          [[ "$IMAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$FRAPPE_REPO" == "https://github.com/frappe/frappe" ]]
          [[ "$FRAPPE_VERSION" == "version-15" ]]
          [[ "$PY_VERSION" == "3.11.6" ]]
          [[ "$NODEJS_VERSION" == "22.11.0" ]]
          [[ "$DOCKERFILE" == "images/custom/Containerfile.buildkit" ]]
          python3 -B ci/validate_crm_uat_apps.py --from-env "$RUNNER_TEMP/crm-uat-apps.json"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::813389018368:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        env:
          IMAGE_NAME: ${{ inputs.image }}
        run: |
          if ! aws ecr describe-repositories --repository-names "$IMAGE_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "$IMAGE_NAME" \
              --region "$AWS_REGION" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256 \
              >/dev/null || aws ecr describe-repositories --repository-names "$IMAGE_NAME" --region "$AWS_REGION" >/dev/null
          fi

      - name: Log in to Amazon ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/custom/Containerfile.buildkit
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ${{ env.ECR_REGISTRY }}/${{ inputs.image }}:${{ inputs.version }}${{ matrix.suffix }}
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-15
          secret-files: |
            apps_json=${{ runner.temp }}/crm-uat-apps.json
          secrets: |
            github_token=${{ secrets.TOKEN }}

      - name: Verify applications in image
        env:
          IMAGE_REF: ${{ env.ECR_REGISTRY }}/${{ inputs.image }}:${{ inputs.version }}${{ matrix.suffix }}
        run: |
          docker run --rm --entrypoint /bin/sh "$IMAGE_REF" -ec '
            for app in frappe erpnext payments hrms crm openmeter_mediator; do
              test -d "/home/frappe/frappe-bench/apps/$app"
            done
            /home/frappe/frappe-bench/env/bin/python -c "import openmeter_mediator"
          '

      - name: Publish verified image
        env:
          IMAGE_REF: ${{ env.ECR_REGISTRY }}/${{ inputs.image }}:${{ inputs.version }}${{ matrix.suffix }}
        run: docker push "$IMAGE_REF"
