name: Build Image
on:
  push:
    branches:
      - master
  repository_dispatch:
    types: [custom_build]
  workflow_dispatch:
    inputs:
      image:
        description: Image name
        type: string
      version:
        description: Image version tag
        type: string
      frappe-repo:
        description: Frappe repo
        type: string
      frappe-version:
        description: Frappe branch
        type: string
      py-version:
        description: Python version
        type: string
      nodejs-version:
        description: NodeJS version
        type: string
      apps-json-base64:
        description: base64 encoded string of apps.json
        type: string
      context:
        description: kaniko context
        type: string
      dockerfile:
        description: dockerfile path from context
        type: string
      registry-user:
        description: user name
        required: false
env:
  TOKEN: ${{ secrets.TOKEN }}
  IMAGE_NAME: ${{ inputs.image }}
  IMAGE_VERSION: ${{ inputs.version }}
  AWS_REGION: eu-west-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-2.amazonaws.com

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    permissions:          
        id-token: write     
        contents: read     
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean Git Cache
        run: git clean -ffdx && git reset --hard

      - name: Run Python Script to Update JSON
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: python ci/script.py

      - name: Source Build Env
        run: |
          [ -f ./ci/build.env ] && cat ./ci/build.env >> $GITHUB_ENV
          [ -f ./ci/version.txt ] && echo "VERSION=$(cat ./ci/version.txt)" >> $GITHUB_ENV
          [ -f ./ci/apps.json ] && echo "APPS_JSON_BASE64=$(base64 -w 0 ./ci/apps.json)" >> $GITHUB_ENV

      - name: Resolve image name and version
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME:-${IMAGE:-apps}}" >> $GITHUB_ENV
          echo "IMAGE_VERSION=${IMAGE_VERSION:-${VERSION:-latest}}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          #aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          #aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} 
          role-to-assume: arn:aws:iam::813389018368:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          set -e
          if ! aws ecr describe-repositories --repository-names "$IMAGE_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "$IMAGE_NAME" \
              --region "$AWS_REGION" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256
            echo "Created ECR repository: $IMAGE_NAME"
          else
            echo "ECR repository already exists: $IMAGE_NAME"
          fi

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push AMD64 image with Kaniko
        uses: int128/kaniko-action@v1
        with:
          push: true
          cache: false
          kaniko-args: |
            --build-arg=FRAPPE_PATH=${{ inputs.frappe-repo || env.FRAPPE_REPO }}
            --build-arg=FRAPPE_BRANCH=${{ inputs.frappe-version || env.FRAPPE_VERSION }}
            --build-arg=PYTHON_VERSION=${{ inputs.py-version || env.PY_VERSION }}
            --build-arg=NODE_VERSION=${{ inputs.nodejs-version || env.NODEJS_VERSION }}
            --build-arg=APPS_JSON_BASE64=${{ inputs.apps-json-base64 || env.APPS_JSON_BASE64 }}
            --destination=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
            --dockerfile=${{ inputs.dockerfile || env.DOCKERFILE }}
            --custom-platform=linux/amd64

      
      - name: Clone Frappe source and app repos for scanning
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: |
          pip install semgrep

          # Clone Frappe framework source
          git clone --depth=1 \
            --branch ${{ inputs.frappe-version || env.FRAPPE_VERSION }} \
            ${{ inputs.frappe-repo || env.FRAPPE_REPO }} \
            /tmp/frappe-src

          # Clone custom app repos from apps.json
          mkdir -p /tmp/apps
          python3 -c "
          import json, subprocess, os
          with open('ci/apps.json') as f:
              apps = json.load(f)
          token = os.environ.get('TOKEN', '')
          for app in apps:
              url = app['url']
              branch = app.get('branch', 'main')
              if token:
                  url = url.replace('https://', f'https://{token}@')
              name = url.rstrip('/').split('/')[-1]
              subprocess.run(['git','clone','--depth=1','--branch',branch,url,f'/tmp/apps/{name}'], check=True)
          "

      - name: Semgrep community rules (custom apps)
        run: |
          semgrep scan \
            --severity ERROR \
            --config=p/owasp-top-ten \
            --config=p/python \
            --config=p/secrets \
            --json \
            --output=semgrep-apps-results.json \
            /tmp/apps || true
        continue-on-error: true

      - name: Semgrep CVE scan on Frappe source (CVE-2026-109608 / CVE-2026-108374)
        run: |
          semgrep scan \
            --severity ERROR \
            --config=.semgrep/frappe-sql-injection.yaml \
            --config=.semgrep/frappe-missing-auth.yaml \
            --config=.semgrep/frappe-version-check.yaml \
            --json \
            --output=semgrep-frappe-cve-results.json \
            /tmp/frappe-src || true
        continue-on-error: true

      - name: Upload Semgrep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-reports-amd64-${{ env.IMAGE_NAME }}-${{ env.IMAGE_VERSION }}
          path: |
            semgrep-apps-results.json
            semgrep-frappe-cve-results.json
          retention-days: 90

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
          format: 'table'
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          cache: false
        continue-on-error: true

      - name: Trivy Image Scan (JSON)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
          format: json
          output: trivy-${{ env.IMAGE_NAME }}-${{ env.IMAGE_VERSION }}.json

      - name: Trivy Image Scan (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
          format: sarif
          output: trivy-${{ env.IMAGE_NAME }}-${{ env.IMAGE_VERSION }}.sarif
          sarif: true

      - name: Convert JSON to CSV
        run: |
          python - <<'EOF'
          import json, csv
          with open("trivy-${{ env.IMAGE_NAME }}-${{ env.IMAGE_VERSION }}.json") as f:
              data = json.load(f)
          with open("trivy-${{ env.IMAGE_NAME }}-${{ env.IMAGE_VERSION }}.csv", "w", newline="") as f:
              w = csv.writer(f)
              w.writerow(["VulnID", "Pkg", "Installed", "Fixed", "Type", "Title", "Severity"])
              for r in data.get("Results", []):
                  for v in r.get("Vulnerabilities", []):
                      w.writerow([v.get("VulnerabilityID"), r.get("PackageName"),
                                  r.get("InstalledVersion"), v.get("FixedVersion", "-"),
                                  r.get("Type"), v.get("Title"), v.get("Severity")])
          EOF

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ env.IMAGE_NAME }}-${{ env.IMAGE_VERSION }}
          path: |
            trivy-*.json
            trivy-*.sarif
            trivy-*.csv
          retention-days: 90  
   

        
  build-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:          
        id-token: write    
        contents: read     
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean Git Cache
        run: git clean -ffdx && git reset --hard

      - name: Run Python Script to Update JSON
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: python ci/script.py

      - name: Source Build Env
        run: |
          [ -f ./ci/build.env ] && cat ./ci/build.env >> $GITHUB_ENV
          [ -f ./ci/version.txt ] && echo "VERSION=$(cat ./ci/version.txt)" >> $GITHUB_ENV
          [ -f ./ci/apps.json ] && echo "APPS_JSON_BASE64=$(base64 -w 0 ./ci/apps.json)" >> $GITHUB_ENV

      - name: Resolve image name and version
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME:-${IMAGE:-apps}}" >> $GITHUB_ENV
          echo "IMAGE_VERSION=${IMAGE_VERSION:-${VERSION:-latest}}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          #aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          #aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: arn:aws:iam::813389018368:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          set -e
          if ! aws ecr describe-repositories --repository-names "$IMAGE_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "$IMAGE_NAME" \
              --region "$AWS_REGION" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256
            echo "Created ECR repository: $IMAGE_NAME"
          else
            echo "ECR repository already exists: $IMAGE_NAME"
          fi

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push ARM64 image with Kaniko
        uses: int128/kaniko-action@v1
        with:
          push: true
          cache: false
          kaniko-args: |
            --build-arg=FRAPPE_PATH=${{ inputs.frappe-repo || env.FRAPPE_REPO }}
            --build-arg=FRAPPE_BRANCH=${{ inputs.frappe-version || env.FRAPPE_VERSION }}
            --build-arg=PYTHON_VERSION=${{ inputs.py-version || env.PY_VERSION }}
            --build-arg=NODE_VERSION=${{ inputs.nodejs-version || env.NODEJS_VERSION }}
            --build-arg=APPS_JSON_BASE64=${{ inputs.apps-json-base64 || env.APPS_JSON_BASE64 }}
            --destination=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}-arm64
            --dockerfile=${{ inputs.dockerfile || env.DOCKERFILE }}
            --custom-platform=linux/arm64
